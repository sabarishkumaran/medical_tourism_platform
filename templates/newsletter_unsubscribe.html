{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-20">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 max-w-md w-full p-10 text-center">
        {% if success %}
        <div class="w-16 h-16 rounded-2xl bg-emerald-50 flex items-center justify-center text-emerald-600 mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 mb-2" style="font-family:'Outfit',sans-serif;">You're Unsubscribed</h1>
        <p class="text-slate-500 text-sm mb-6"><strong>{{ email }}</strong> has been removed from our newsletter. You won't receive any further emails from us.</p>
        {% else %}
        <div class="w-16 h-16 rounded-2xl bg-rose-50 flex items-center justify-center text-rose-500 mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 mb-2" style="font-family:'Outfit',sans-serif;">Not Found</h1>
        <p class="text-slate-500 text-sm mb-6"><strong>{{ email }}</strong> was not found in our newsletter list.</p>
        {% endif %}
        <a href="{% url 'home' %}" class="inline-block bg-slate-900 text-white font-bold py-3 px-8 rounded-xl hover:bg-sky-600 transition-colors text-sm">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
