{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 md:px-8 py-10">

    <div class="mb-10">
        <h1 class="text-4xl font-extrabold text-slate-900" style="font-family: 'Outfit', sans-serif;">Hospital Directory</h1>
        <p class="text-slate-500 mt-2">Manage and review all hospital partnerships across the platform.</p>
    </div>

    <!-- Status Filter Tabs -->
    <div class="flex overflow-x-auto hide-scrollbars mb-8 bg-white p-2 rounded-2xl shadow-sm border border-slate-100 items-center justify-start gap-2">
        <a href="?status=ALL" class="px-6 py-2.5 rounded-xl text-sm font-bold transition-colors whitespace-nowrap {% if status_filter == 'ALL' %}bg-slate-900 text-white{% else %}text-slate-500 hover:bg-slate-50 hover:text-slate-700{% endif %}">
            All Hospitals
        </a>
        <a href="?status=PENDING" class="px-6 py-2.5 rounded-xl text-sm font-bold transition-colors whitespace-nowrap {% if status_filter == 'PENDING' %}bg-amber-100 text-amber-700{% else %}text-slate-500 hover:bg-slate-50 hover:text-slate-700{% endif %}">
            Pending Review
        </a>
        <a href="?status=APPROVED" class="px-6 py-2.5 rounded-xl text-sm font-bold transition-colors whitespace-nowrap {% if status_filter == 'APPROVED' %}bg-emerald-100 text-emerald-700{% else %}text-slate-500 hover:bg-slate-50 hover:text-slate-700{% endif %}">
            Approved Partners
        </a>
        <a href="?status=REJECTED" class="px-6 py-2.5 rounded-xl text-sm font-bold transition-colors whitespace-nowrap {% if status_filter == 'REJECTED' %}bg-rose-100 text-rose-700{% else %}text-slate-500 hover:bg-slate-50 hover:text-slate-700{% endif %}">
            Suspended
        </a>
    </div>

    <!-- AJAX-Enabled Grid -->
    {% include "partials/pending_hospital_grid.html" %}

</div>
{% endblock %}
