{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 md:px-8 py-10">
    <div class="max-w-7xl mx-auto animate-fade-up">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight" style="font-family: 'Outfit', sans-serif;">
                    Hospital Inquiry Hub
                </h1>
                <p class="text-slate-500 mt-1 text-lg">
                    Central management for all patient hospital-inquiries.
                </p>
                <!-- Tabs removed to separate Patient Inquiries from Contact Messages -->
            </div>
            
            <div class="flex items-center gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
                 <span class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-50 text-slate-600 font-bold text-xs uppercase tracking-widest">
                    <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Total Records: {{ page_obj.paginator.count }}
                 </span>
            </div>
        </div>

        <!-- Search Section -->
        <div class="mb-8">
            <form hx-get="{% url 'inquiry_hub' %}" hx-target="#admin-inquiry-grid-container" hx-swap="outerHTML" hx-push-url="true" class="max-w-md">
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none">
                        <svg class="w-5 h-5 text-slate-400 group-focus-within:text-sky-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" name="q" placeholder="Search inquiries..." value="{{ q }}"
                           class="w-full pr-4 py-3.5 bg-white border border-slate-200 rounded-2xl focus:ring-4 focus:ring-sky-500/10 focus:border-sky-500 transition-all text-sm font-medium text-slate-700 placeholder-slate-400 shadow-sm hover:shadow-md"
                           style="padding-left: 3rem;"
                           onkeyup="clearTimeout(this.timer); this.timer = setTimeout(() => this.form.dispatchEvent(new Event('submit')), 500);">
                </div>
            </form>
        </div>

        <!-- Inquiries View -->
        <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
            {% include "partials/admin_inquiry_grid.html" %}
        </div>

    </div>
</div>
{% endblock %}
