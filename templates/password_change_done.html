{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 md:px-8 py-20">
    <div class="max-w-md mx-auto text-center animate-fade-up">
        
        <div class="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 shadow-inner shadow-emerald-200/50">
            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 dark:text-slate-100 mb-4" style="font-family: 'Outfit', sans-serif;">Password Updated!</h1>
        <p class="text-slate-500 dark:text-slate-400 dark:text-slate-400 mb-10 font-medium">Your security settings have been successfully updated. Your account is now even safer.</p>

        <a href="{% url 'profile' %}" class="inline-flex items-center justify-center bg-slate-900 dark:bg-slate-700 hover:bg-sky-600 dark:hover:bg-sky-500 text-white font-bold py-4 px-10 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer">
            Return to Profile
        </a>
    </div>
</div>
{% endblock %}
