{% extends "base.html" %}

{% block content %}
<h1 class="text-4xl font-bold mb-8">My Inquiries</h1>
<div class="space-y-4">
  {% for inquiry in inquiries %}
    <div class="bg-white border border-slate-200 shadow-sm rounded-2xl p-6">
      <p><strong>Treatment:</strong> {{ inquiry.treatment.name }}</p>
      <p><strong>Status:</strong> <span class="text-blue-600 font-semibold">{{ inquiry.status }}</span></p>
    </div>
  {% empty %}
    <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center text-slate-500">No inquiries yet.</div>
  {% endfor %}
</div>
{% endblock %}
