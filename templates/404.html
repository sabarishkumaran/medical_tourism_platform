{% extends "base.html" %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center p-6 mx-auto overflow-hidden">
    <div class="max-w-2xl w-full text-center space-y-12 animate-fade-up relative">
        
        <!-- Animated 404 Background -->
        <div class="absolute inset-0 flex items-center justify-center -z-10 select-none pointer-events-none opacity-[0.03]">
            <h1 class="text-[20rem] font-black tracking-tighter">404</h1>
        </div>

        <!-- 404 Illustration -->
        <div class="relative inline-block h-64 md:h-80 w-full max-w-sm mx-auto">
            <div class="absolute inset-x-0 bottom-0 h-4 bg-slate-900/5 rounded-full blur-xl scale-x-50 animate-pulse"></div>
            
            <!-- Drifting Island / Cloud with 404 -->
            <div class="absolute inset-0 flex items-center justify-center animate-bounce-slow">
                <div class="relative">
                    <div class="text-9xl md:text-[12rem] font-black text-slate-100 drop-shadow-2xl flex items-baseline">
                        4
                        <div class="relative w-24 h-24 md:w-32 md:h-32 bg-sky-500 rounded-full mx-2 flex items-center justify-center animate-spin-slow">
                            <svg class="w-16 h-16 md:w-20 md:h-20 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"></path>
                            </svg>
                        </div>
                        4
                    </div>
                </div>
            </div>

            <!-- Floating Particles -->
            <div class="absolute top-10 right-10 w-6 h-6 bg-sky-200/50 rounded-full animate-float blur-sm"></div>
            <div class="absolute top-40 left-0 w-8 h-8 bg-sky-100 rounded-full animate-float-delayed blur-[2px]"></div>
            <div class="absolute bottom-20 right-0 w-4 h-4 bg-emerald-100 rounded-full animate-float delay-700 blur-[1px]"></div>
        </div>

        <div class="space-y-4">
            <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight" style="font-family: 'Outfit', sans-serif;">Lost in the Cloud?</h1>
            <p class="text-lg text-slate-500 font-medium max-w-md mx-auto">The page you're searching for seems to have drifted away. Let's get you back on track.</p>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-6">
            <a href="{% url 'home' %}" class="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 px-10 rounded-2xl transition-all shadow-lg hover:shadow-slate-500/30 flex items-center justify-center gap-2 group">
                <svg class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Return to Home
            </a>
            <a href="{% url 'contact' %}" class="w-full sm:w-auto bg-sky-50 text-sky-600 font-bold py-4 px-10 rounded-2xl hover:bg-sky-100 transition-all border border-sky-100 flex items-center justify-center gap-2">
                Need Help?
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </a>
        </div>
    </div>
</div>

<style>
    @keyframes float {
        0%, 100% { transform: translateY(0) translateX(0); }
        33% { transform: translateY(-10px) translateX(10px); }
        66% { transform: translateY(5px) translateX(-5px); }
    }
    @keyframes float-delayed {
        0%, 100% { transform: translateY(0) translateX(0); }
        33% { transform: translateY(15px) translateX(-15px); }
        66% { transform: translateY(-10px) translateX(10px); }
    }
    @keyframes bounce-slow {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
    }
    @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .animate-float { animation: float 6s infinite ease-in-out; }
    .animate-float-delayed { animation: float-delayed 8s infinite ease-in-out; }
    .animate-bounce-slow { animation: bounce-slow 4s infinite ease-in-out; }
    .animate-spin-slow { animation: spin-slow 12s infinite linear; }
    .animate-spin-slow:hover { animation-play-state: paused; }
</style>
{% endblock %}
