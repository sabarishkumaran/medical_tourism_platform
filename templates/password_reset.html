{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 md:px-8 py-10">
    <div class="h-[85vh] -mt-10 mb-[-2.5rem] flex items-center justify-center p-4 animate-fade-up">
        <div class="w-full max-w-md bg-white rounded-[2rem] shadow-2xl p-8 md:p-12">
            <div class="mb-10 text-center">
                <h2 class="text-3xl font-bold text-slate-800 mb-2" style="font-family: 'Outfit', sans-serif;">Reset Password</h2>
                <p class="text-slate-500">Enter your email address and we'll send you a link to reset your password.</p>
            </div>

            <form method="POST" class="space-y-6">
                {% csrf_token %}

                {% if form.errors %}
                <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm font-medium mb-4">
                    <p>There was an error with your submission. Please try again.</p>
                </div>
                {% endif %}
                
                <div class="space-y-5">
                    <div class="group">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 group-focus-within:text-sky-600 transition-colors">Email Address</label>
                        <input type="email" name="email" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 transition-all focus:bg-white focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 outline-none placeholder:text-slate-400" required placeholder="Enter your email">
                    </div>
                </div>

                <button type="submit" class="w-full bg-slate-900 hover:bg-sky-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_4px_14px_0_rgba(0,0,0,0.1)] hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5 cursor-pointer">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-sm text-slate-500">
                    Remember your password?
                    <a href="{% url 'login' %}" class="text-sky-600 font-bold hover:text-sky-800 transition-colors">Log In</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
