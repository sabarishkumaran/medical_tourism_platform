{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 md:px-8 py-10">
    <div class="h-[85vh] -mt-10 mb-[-2.5rem] flex items-center justify-center p-4 animate-fade-up">
        <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl p-8 md:p-12 text-center">
            
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>

            <div class="mb-8">
                <h2 class="text-3xl font-bold text-slate-800 dark:text-slate-200 mb-4" style="font-family: 'Outfit', sans-serif;">Password Updated!</h2>
                <p class="text-slate-500 dark:text-slate-400 dark:text-slate-400">Your password has been successfully reset. You can now log in with your new password.</p>
            </div>

            <div>
                <a href="{% url 'login' %}" class="inline-block w-full bg-slate-900 dark:bg-slate-700 hover:bg-sky-600 dark:hover:bg-sky-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-[0_4px_14px_0_rgba(0,0,0,0.1)] hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5">
                    Log In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
