{% extends "base.html" %}

{% block content %}
<div x-data="{ showFilters: false }" class="container mx-auto px-4 md:px-8 py-10">
    <!-- Header Section -->
    <div class="max-w-7xl mx-auto mb-12 animate-fade-up">
        <h1 class="text-3xl md:text-5xl font-extrabold text-slate-900 mb-4 text-center"
            style="font-family: 'Outfit', sans-serif;">Accredited Medical Facilities</h1>
        <p class="text-slate-500 text-center max-w-2xl mx-auto text-lg mb-10">Browse our network of world-class
            hospitals and specialized clinics.</p>

        <!-- Mobile Filter Toggle -->
        <div class="lg:hidden mb-8">
            <button type="button" @click="showFilters = true" 
                class="flex items-center justify-center gap-2 bg-white border border-slate-200 p-4 rounded-2xl shadow-sm text-slate-700 font-bold w-full active:scale-95 transition-all">
                <svg class="w-5 h-5 text-sky-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                <span>Refine Facilities</span>
            </button>
        </div>

        <!-- Sidebar Overlay for Mobile -->
        <div x-show="showFilters" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-300"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             @click="showFilters = false"
             class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] lg:hidden">
        </div>

        <!-- Filter Bar (Horizontal on Desktop, Sliding Sidebar on Mobile) -->
        <aside 
            x-show="window.innerWidth >= 1024 || showFilters"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="-translate-x-full lg:translate-x-0"
            x-transition:enter-end="translate-x-0"
            x-transition:leave="transition ease-in duration-300"
            x-transition:leave-start="translate-x-0"
            x-transition:leave-end="-translate-x-full lg:translate-x-0"
            :class="{
                'fixed inset-y-0 left-0 w-[400px] max-w-[85vw] z-[70] shadow-2xl p-8 rounded-r-3xl flex flex-col items-stretch overflow-y-auto': showFilters && window.innerWidth < 1024,
                'bg-white p-4 md:p-6 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col md:flex-row gap-4 items-stretch md:items-center w-full max-w-5xl mx-auto mb-16': window.innerWidth >= 1024
            }"
            class="bg-white">

            <!-- Mobile Close Button -->
            <div class="lg:hidden flex justify-between items-center mb-8">
                <h2 class="text-xl font-bold text-slate-800">Filters</h2>
                <button @click="showFilters = false" class="p-2 text-slate-400 hover:text-slate-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="flex-1 relative mb-4 lg:mb-0">
                <label class="lg:hidden block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Search</label>
                <input type="text" name="q" value="{{ query }}" placeholder="Search by name or city..."
                    hx-get="{% url 'hospital_list' %}" hx-target="#hospital-results"
                    hx-trigger="keyup changed delay:500ms" hx-include="[name='country'],[name='accreditation']" hx-push-url="true"
                    class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 focus:ring-4 focus:ring-sky-500/20 text-slate-700 font-medium">
            </div>

            <div class="flex-1 mb-4 lg:mb-0">
                <label class="lg:hidden block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Destination</label>
                <select name="country" hx-get="{% url 'hospital_list' %}" hx-target="#hospital-results"
                    hx-trigger="change" hx-include="[name='q'],[name='accreditation']" hx-push-url="true"
                    class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 focus:ring-4 focus:ring-sky-500/20 text-slate-700 cursor-pointer appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E')] bg-[length:12px_12px] bg-[right_1.25rem_center] bg-no-repeat font-medium text-sm">
                    <option value="">All Countries</option>
                    {% for cnt in countries %}
                    <option value="{{ cnt }}" {% if current_country == cnt %}selected{% endif %}>{{ cnt }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex-1 mb-6 lg:mb-0">
                <label class="lg:hidden block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Accreditation</label>
                <select name="accreditation" hx-get="{% url 'hospital_list' %}" hx-target="#hospital-results"
                    hx-trigger="change" hx-include="[name='q'],[name='country']" hx-push-url="true"
                    class="w-full bg-slate-50 border-none rounded-2xl px-5 py-4 focus:ring-4 focus:ring-sky-500/20 text-slate-700 cursor-pointer appearance-none bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E')] bg-[length:12px_12px] bg-[right_1.25rem_center] bg-no-repeat font-medium text-sm">
                    <option value="">All Accreditations</option>
                    {% for code, name in accreditation_options %}
                    {% if code %}
                    <option value="{{ code }}" {% if current_accreditation == code %}selected{% endif %}>{{ name }}</option>
                    {% endif %}
                    {% endfor %}
                </select>
            </div>

            <!-- <button
                class="lg:mt-0 bg-slate-900 shadow-xl shadow-slate-900/20 text-white font-bold px-10 py-4 rounded-2xl hover:bg-sky-600 transition-all active:scale-95 border border-white/10"
                hx-get="{% url 'hospital_list' %}" hx-target="#hospital-results"
                hx-include="[name='q'],[name='country'],[name='accreditation']" hx-push-url="true">Search</button> -->
        </aside>
    </div>

    <!-- Hospital Grid Container -->
    <div class="max-w-7xl mx-auto" id="hospital-results">
        {% include "partials/hospital_grid.html" %}
    </div>
</div>

<script>
    document.body.addEventListener('htmx:beforeRequest', function (evt) {
        document.getElementById('hospital-results').style.opacity = '0.5';
    });
    document.body.addEventListener('htmx:afterRequest', function (evt) {
        document.getElementById('hospital-results').style.opacity = '1';
    });
</script>
{% endblock %}
