{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 md:px-8 py-10">
    <div class="max-w-5xl mx-auto">
        <!-- Breadcrumbs -->
        <nav class="flex items-center gap-2 text-slate-400 dark:text-slate-400 text-xs font-bold uppercase tracking-widest mb-8">
            <a href="{% url 'patient_dashboard' %}" class="hover:text-sky-600 transition-colors">Dashboard</a>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            <span class="text-slate-600 dark:text-slate-400 dark:text-slate-400">My Inquiries</span>
        </nav>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <h1 class="text-3xl font-black text-slate-900 dark:text-slate-100 mb-2" style="font-family: 'Outfit', sans-serif;">{{ filter_display }}</h1>
                <p class="text-slate-500 dark:text-slate-400 dark:text-slate-400 font-medium">Manage and track your medical requests in one place.</p>
            </div>
            <a href="{% url 'submit_inquiry' %}" class="bg-slate-900 dark:bg-slate-700 text-white font-bold px-6 py-3 rounded-2xl hover:bg-sky-600 dark:hover:bg-sky-500 transition-all shadow-lg shadow-slate-200 flex items-center gap-2 group">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                New Inquiry
            </a>
        </div>

        <!-- Inquiries List Container -->
        <div class="bg-white dark:bg-slate-900 rounded-[2.5rem] shadow-sm border border-slate-100 dark:border-slate-800 overflow-hidden">
            <div id="patient-inquiry-container">
                {% include "partials/patient_inquiry_list.html" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
