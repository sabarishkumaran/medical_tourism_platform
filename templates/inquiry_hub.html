{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 md:px-8 py-10">
    <div class="max-w-7xl mx-auto animate-fade-up">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight" style="font-family: 'Outfit', sans-serif;">Patient Messages</h1>
                <p class="text-slate-500 mt-1 text-lg">Central management for website contact form messages.</p>
            </div>
            
            <div class="flex items-center gap-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-100">
                 <span class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-slate-50 text-slate-600 font-bold text-xs uppercase tracking-widest">
                    <svg class="w-4 h-4 text-sky-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    Total Records: {{ page_obj.paginator.count }}
                 </span>
            </div>
        </div>

        <!-- Messages View (Table for Desktop, Cards for Mobile) -->
        <div class="bg-white rounded-[2.5rem] shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden" x-data="{ selectedId: null }">
            
            <!-- AJAX-Enabled Inquiry List -->
            {% include "partials/inquiry_list.html" %}
        </div>

    </div>
</div>
{% endblock %}
