{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 md:px-8 py-10">
    <div class="max-w-xl mx-auto">
        <!-- Back Link -->
        <a href="{% url 'hospital_manage_inquiries' %}" class="inline-flex items-center gap-2 text-slate-500 hover:text-sky-600 mb-8 transition-colors group">
            <svg class="w-5 h-5 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            <span class="font-bold text-sm uppercase tracking-wider">Back to Inquiries</span>
        </a>

        <!-- Main Card -->
        <div class="bg-white dark:bg-slate-900 rounded-[2.5rem] p-8 md:p-12 shadow-sm border border-slate-100 dark:border-slate-800 relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-indigo-50 rounded-full blur-3xl opacity-50"></div>
            
            <div class="relative z-10 text-center mb-10">
                <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-3xl flex items-center justify-center mx-auto mb-6">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.907c.961 0 1.371 1.24.588 1.81l-3.97 2.883a1 1 0 00-.364 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.971-2.883a1 1 0 00-1.178 0l-3.97 2.883c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.364-1.118L2.98 10.3c-.783-.57-.373-1.81.588-1.81h4.908a1 1 0 00.95-.69l1.519-4.674z"></path></svg>
                </div>
                <h1 class="text-3xl font-black text-slate-900 dark:text-slate-100 mb-2" style="font-family: 'Outfit', sans-serif;">
                    Rate Your Patient
                </h1>
                <p class="text-slate-500 dark:text-slate-400 font-medium">
                    Submit review for patient <strong>{{ inquiry.patient.get_full_name|default:inquiry.patient.username }}</strong>
                </p>
            </div>

            <form method="POST" class="space-y-8">
                {% csrf_token %}
                
                <div class="space-y-6" x-data="{ rating: 5 }">
                    <!-- Rating Selection -->
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3 text-center">Your Rating</label>
                        <input type="hidden" name="rating" :value="rating">
                        <div class="flex items-center justify-center gap-3">
                            <template x-for="i in 5">
                                <button type="button" @click="rating = i" class="text-4xl transition-all focus:outline-none transform hover:scale-110">
                                    <svg class="w-10 h-10" :class="i <= rating ? 'text-amber-400 fill-amber-400' : 'text-slate-200 dark:text-slate-800 fill-transparent'" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path></svg>
                                </button>
                            </template>
                        </div>
                    </div>

                    <!-- Comment -->
                    <div>
                        <label class="block text-xs font-black text-slate-400 uppercase tracking-widest mb-3">Review Details</label>
                        <textarea name="comment" required rows="4" class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-3 text-slate-800 dark:text-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all" placeholder="Share your experience hosting and treating this patient..."></textarea>
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100 dark:border-slate-800 flex flex-col sm:flex-row gap-4">
                    <a href="{% url 'hospital_manage_inquiries' %}" class="flex-1 py-4 px-8 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-center font-black hover:bg-slate-200 transition-colors">
                        Cancel
                    </a>
                    <button type="submit" class="flex-1 py-4 px-8 rounded-2xl bg-indigo-600 text-white font-black hover:bg-indigo-700 transition-all shadow-xl active:scale-95">
                        Submit Review
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
